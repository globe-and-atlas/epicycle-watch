[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epicycle-watch"
version = "0.1.0"
description = "Native single-chain analog watchface for Pebble Time 2 and Round 2"
requires-python = ">=3.11"
dependencies = [
  "Pillow==12.3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0"
]
